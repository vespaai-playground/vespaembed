[project]
name = "vespaembed"
version = "0.0.7"
description = "vespaembed: no-code training for embedding models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache 2.0"}
authors = [
    {name = "Abhishek Thakur"}
]
dependencies = [
    "sentence-transformers>=5.7.0",
    # [CANNOT-FIX] CVE-2026-4372/-5241/-9856/-80047, CVE-2025-14921 - fixed only in
    # transformers 5.x, but EVERY optimum-onnx release caps transformers <4.58.0 and the
    # unsloth extra caps <=5.5.0; optimum[onnxruntime] drives src/vespaembed/models/export.py.
    # [CANNOT-FIX] CVE-2026-85670 - tokenizers 0.23.2 (latest) is still affected; no fix exists.
    # Full rationale: PR #15 / VESPANG-3310 - verified 2026-09-16
    "transformers>=4.57.6",
    "accelerate>=1.15.0",
    "torch>=2.10.0",
    "datasets>=4.3.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "python-multipart>=0.0.32",
    "websockets>=17.1",
    "pyyaml>=6.0.3",
    # [CANNOT-FIX] CVE-2026-71281 - peft 0.21.0 (latest) still calls bare torch.load() at
    # corda.py:102/:163 and loraga.py:101 - Full rationale: PR #15 / VESPANG-3310 - verified 2026-09-16
    "peft>=0.21.0",
    "tensorboard>=2.21.0",
    "onnx>=1.22.0",
    "onnxruntime>=1.30.0",
    "optimum[onnxruntime]>=2.1.0",
]

[project.optional-dependencies]
unsloth = ["unsloth>=2026.5.2"]
dev = [
    "black==26.5.1",
    "isort==9.0.1",
    "flake8==7.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.urls]
Homepage = "https://github.com/vespaai-playground/vespaembed"

[project.scripts]
vespaembed = "vespaembed.cli.vespaembed:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vespaembed = ["static/**/*"]

[tool.black]
line-length = 119
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.env
  | env
  | build
  | dist
  | unsloth_examples
  | frontend
)/
'''

[tool.isort]
profile = "black"
line_length = 119
skip = [".venv", "venv", ".env", "env", "build", "dist", "unsloth_examples", "frontend"]

[tool.flake8]
ignore = ["E203", "E501", "W503"]
max-line-length = 119
per-file-ignores = { "__init__.py" = ["F401", "E402"] }
exclude = [".git", ".venv", "__pycache__", "dist", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
